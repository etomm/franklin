id: web-ui-overlay
title: Web UI overlay (gnuton httpd on :8088, optional /www bind)
kind: workaround
required: false
enabled_by_default: true
requires: [web-ui, boot-hook]
provides:
  - gnuton UI reachable on :8088
  - optional bind-mount of gnuton /www over stock /www
payload: payload
hooks:
  start: start.sh
  stop: stop.sh
notes: >
  Stock has no way to replace its own UI, so this workaround has two modes.
  Default: run gnuton's httpd from USB on a spare port (:8088), stock :80
  untouched. Replace mode (state/web-ui-overlay.replace): pre-flight the
  binary on :8089, then bind-mount a wrapper over /usr/sbin/httpd and gnuton's
  /www over /www, restart the stock httpd and verify :80 — rolling back to the
  stock binary if it does not answer. Rootfs is a read-only squashfs, so a bind
  mount is the only way to replace the binary; the wrapper exists because rc
  restarts /usr/sbin/httpd itself and the gnuton libs need LD_LIBRARY_PATH.
