id: web-ui-overlay
title: Web UI overlay (gnuton httpd on :8088, optional /www bind)
kind: workaround
required: false
enabled_by_default: true
requires: [web-ui, boot-hook]
provides:
  - gnuton UI reachable on :8088
  - optional bind-mount of gnuton /www over stock /www
payload: payload
hooks:
  start: start.sh
  stop: stop.sh
notes: >
  Stock has no way to replace its own UI, so this workaround runs gnuton's
  httpd from USB on a spare port (verified on the XT9) and can optionally
  bind-mount gnuton's /www over the stock one. Enable the bind mode with
  franklin/state/web-ui-overlay.bindwww; disable it with stop.sh.
