id: ipset
title: ipset
kind: gnuton-feature
required: false
enabled_by_default: false
requires: [kernel-modules]
provides:
  - ip_set.ko
  - ip_set_hash_ip.ko
  - ipset tool
payload: payload
hooks:
  start: start.sh
  stop: stop.sh
build: build.sh
notes: >
  build.sh stages the .ko files and, when available, the gnuton `ipset` binary
  into payload/; start.sh loads the modules and links the tool to /tmp.
