id: web-ui
title: Web UI (gnuton httpd + /www)
kind: gnuton-feature
required: false
enabled_by_default: false
requires: [boot-hook]
provides:
  - gnuton httpd
  - gnuton /www tree
  - gnuton-only shared libraries
payload: payload
build: build.sh
notes: >
  Data-only feature. build.sh stages gnuton's httpd, the /www *delta* (only
  the 427 files that are new or differ from stock) plus a WHITEOUTS list, and
  the libs that differ from stock. At boot the delta is the top layer of an
  overlayfs stack whose lower layer is the stock /www, so unchanged ASUS pages
  remain as fallback and dropped pages are hidden with whiteouts.
