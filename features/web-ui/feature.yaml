id: web-ui
title: Web UI (gnuton httpd + /www)
kind: gnuton-feature
required: false
enabled_by_default: false
requires: [boot-hook]
provides:
  - gnuton httpd
  - gnuton /www tree
  - gnuton-only shared libraries
payload: payload
build: build.sh
notes: >
  Data-only feature. build.sh stages gnuton's httpd, /www and the libraries
  that differ from stock directly into payload/, so the folder layout is the
  layout on the stick: payload/httpd, payload/www/, payload/lib/.
