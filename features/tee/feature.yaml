provides:
  - xt_TEE.ko
  - nf_dup_ipv4.ko
  - nf_dup_ipv6.ko
artifacts:
  - build/tee/xt_TEE.ko
  - build/tee/nf_dup_ipv4.ko
  - build/tee/nf_dup_ipv6.ko
files:
