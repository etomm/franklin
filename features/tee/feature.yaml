id: tee
title: TEE (packet duplication)
kind: gnuton-feature
required: false
enabled_by_default: false
requires: [kernel-modules]
provides:
  - xt_TEE.ko
  - nf_dup_ipv4.ko
  - nf_dup_ipv6.ko
payload: payload
hooks:
  start: start.sh
  stop: stop.sh
build: build.sh
notes: >
  build.sh stages the three .ko files into payload/; start.sh loads nf_dup
  first, then xt_TEE.
