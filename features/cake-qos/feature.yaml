id: cake-qos
title: Cake QoS
kind: gnuton-feature
required: false
enabled_by_default: false
requires: [kernel-modules]
provides:
  - sch_cake.ko
payload: payload
hooks:
  start: start.sh
  stop: stop.sh
build: build.sh
notes: >
  payload/sch_cake.ko is produced by build.sh (ASUS GPL, kernel 4.19.183) and
  loaded from this feature's own folder.
