# Franklin composition file.
#
# This is the only file the composer needs to know *what* goes on the USB key.
# Every listed feature must have features/<id>/feature.yaml declaring its
# dependencies, files and hooks.
#
# Usage:  python tools/franklin-compose.py            # compose into build/usb
#         python tools/franklin-compose.py --check    # verify only
#         python tools/franklin-compose.py --without tee

version: 1

# Features to include. Dependencies are added automatically (transitive).
# Use `all: true` to include every feature that has a feature.yaml.
#
# Optional, NOT composed by default: `entware`. It is a self-contained feature
# tree (features/entware/) and only gets on the stick when you ask for it:
#   python tools/franklin-compose.py --add entware
# or by adding the line below. Nothing else requires it: the /opt prefix exists
# without it (web UI libraries live there), so the rest of the composition is
# unaffected while it is absent.
#  - entware
features:
  - boot-hook
  - kernel-modules
  - cake-qos
  - tee
  - ipset
  - overlayfs
  - franklin-mount
  - web-ui
  - web-ui-overlay
  - partial-rc
  - wifi-clients
  - wifi-insight
  - traffic-monitor
  - snmp
  - networkmap

# Optional per-device profile applied over the composition.
profile: xt9

# Re-point /tmp/opt (and therefore the /opt/* symlinks ASUS creates) at the
# Franklin tree, so Entware can install into franklin/opt and survive rebuilds.
opt: true

# Directories under franklin/ that the composer must never delete when
# rebuilding in place on a real stick (installed packages, state, logs).
preserve:
  - state
  - log
